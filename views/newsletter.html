<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Suscríbete - EcoMarket</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <div class="contenedor-borde">
    <main class="contenedor">
        <section class="tarjeta-producto" style="max-width: 500px; margin: 0 auto; padding: 2rem;">
            <h2>Newsletter - Target Hack</h2>
            <p>Suscríbete para recibir consejos de vida sostenible.</p>
            <form action="newsletter-gracias.html" method="GET" class="formulario-inteligente">
                <div class="grupo-formulario">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="grupo-formulario" >
                    <input type="checkbox" id="legal" required>
                    <label for="legal">Acepto el consentimiento de privacidad</label>
                </div>
                <button type="submit" class="boton boton-principal" style="width: 100%;">Suscribirse</button>
            </form>
        </section>
    </main>
    </div>
</body>
</html>
