<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Huella - EcoMarket</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <div class="contenedor-borde">
    <main class="contenedor">
        <h1>Calculadora de Huella de Carbono</h1>
        <form action="resultados-huella.html" method="GET" class="formulario-inteligente">
            <div class="grupo-formulario">
                <label for="energia">Consumo Energía (kWh mensuales)</label>
                <input type="number" id="energia" name="energia" required placeholder="Ej: 150">
            </div>
            <div class="grupo-formulario">
                <label for="transporte">Km recorridos al mes</label>
                <input type="number" id="transporte" name="transporte" required placeholder="Ej: 500">
            </div>
            <button type="submit" class="boton boton-principal">Calcular Impacto</button>
        </form>
    </main>
    </div>
</body>
</html>
