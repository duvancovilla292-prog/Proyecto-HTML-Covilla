<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - EcoMarket</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
<div class="contenedor-borde">
    <header class="encabezado-principal">
        <div class="logotipo"><a href="../index.html">EcoMarket</a></div>
        <nav class="navegacion-principal">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="sobre-nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html" class="activo">Contacto</a></li>
            </ul>
        </nav>
        <div class="acciones-encabezado">
            <a href="#buscar">🔍</a>
            <a href="#carrito">🛒 <span class="contador-carrito">0</span></a>
        </div>
    </header>
    <main class="contenedor-pagina-contacto contenedor">
        <section class="disposicion-contenido-contacto">
            <div class="bloque-formulario-contacto">
                <h2>Escríbenos</h2>
                <p>¿Tienes dudas o propuestas de colaboración? Envíanos un mensaje.</p>
                <form class="formulario-inteligente" action="#" method="POST">
                    <div class="grupo-formulario">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required pattern="[A-Za-aCcCcEeIiOoUuNn ]{3,50}">
                        <span class="mensaje-validacion"></span>
                    </div>
                    <div class="grupo-formulario">
                        <label for="correo">Correo Electrónico</label>
                        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                        <span class="mensaje-validacion"></span>
                    </div>
                    <div class="grupo-formulario">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="5" placeholder="¿En qué te podemos ayudar?" required></textarea>
                        <span class="mensaje-validacion"></span>
                    </div>
                    <button type="submit" class="boton boton-enviar">Enviar Mensaje</button>
                </form>
            </div>
            <div class="bloque-informacion-contacto">
                <h2>Nuestra Ubicación</h2>
                <div class="envoltura-mapa">
                    <img src="../img/hero/l.jpeg" alt="Mapa de ubicación de la tienda principal de EcoMarket" class="mapa-estatico">
                </div>
                <div class="bloque-redes-sociales">
                    <h3>Conéctate en Redes</h3>
                    <p>Respondemos de inmediato por aquí:</p>
                    <div class="iconos-sociales-animados">
                        <a href="https://instagram.com" target="_blank" rel="noopener" class="escala-icono-social">Instagram</a>
                        <a href="https://facebook.com" target="_blank" rel="noopener" class="escala-icono-social">Facebook</a>
                        <a href="https://twitter.com" target="_blank" rel="noopener" class="escala-icono-social">Twitter</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="pie-principal">
        <div class="base-pie"><p>&copy; 2026 EcoMarket. Todos los derechos reservados.</p></div>
    </footer>
</div>
</body>
</html>
