<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - EcoMarket</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body>

    <header class="main-header">
        <div class="logo"><a href="../index.html">EcoMarket</a></div>
        <nav class="main-nav">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="sobre-nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <a href="#search">🔍</a>
            <a href="#cart">🛒 <span class="cart-count">0</span></a>
        </div>
    </header>

    <main class="contact-page-container container">
        <section class="contact-content-layout">
            
            <div class="contact-form-block">
                <h2>Escríbenos</h2>
                <p>¿Tienes dudas o propuestas de colaboración? Envíanos un mensaje.</p>
                
                <form class="intelligent-form" action="#" method="POST">
                    <div class="form-group">
                        <label for="username">Nombre Completo</label>
                        <input type="text" id="username" name="username" placeholder="Tu nombre" required>
                        <span class="validation-msg"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                        <span class="validation-msg"></span>
                    </div>

                    <div class="form-group">
                        <label for="message">Mensaje</label>
                        <textarea id="message" name="message" rows="5" placeholder="¿En qué te podemos ayudar?" required></textarea>
                        <span class="validation-msg"></span>
                    </div>

                    <button type="submit" class="btn btn-submit">Enviar Mensaje</button>
                </form>
            </div>

            <div class="contact-info-block">
                <h2>Nuestra Ubicación</h2>
                <div class="map-wrapper">
                    <img src="../img/hero/map-static.png" alt="Mapa de ubicación de la tienda principal de EcoMarket" class="static-map">
                </div>

                <div class="social-networks-block">
                    <h3>Conéctate en Redes</h3>
                    <p>Respondemos de inmediato por aquí:</p>
                    <div class="animated-social-icons">
                        <a href="https://instagram.com" target="_blank" rel="noopener" class="social-icon-scale">Instagram</a>
                        <a href="https://facebook.com" target="_blank" rel="noopener" class="social-icon-scale">Facebook</a>
                        <a href="https://twitter.com" target="_blank" rel="noopener" class="social-icon-scale">Twitter</a>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-bottom"><p>&copy; 2026 EcoMarket. Todos los derechos reservados.</p></div>
    </footer>

</body>
</html>
